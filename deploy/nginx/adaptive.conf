# Nginx reverse proxy for Adaptive Quiz API with SSE considerations.
# Place under /etc/nginx/conf.d/adaptive.conf and reload nginx.

upstream adaptive_api {
    server 127.0.0.1:8000;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    # General proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $request_id;

    # Default API location
    location / {
        proxy_pass http://adaptive_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Allow webs from same site; CORS handled by app
    }

    # SSE endpoint: disable buffering and gzip, set long timeouts
    location ~* ^/quizzes/.*/stream$ {
        proxy_pass http://adaptive_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Required for SSE
        proxy_buffering off;
        gzip off;

        # Helpful headers for proxies
        add_header X-Accel-Buffering no;
        add_header Cache-Control no-cache;
    }

    # Basic security headers (adjust to your needs)
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy no-referrer-when-downgrade;
}
