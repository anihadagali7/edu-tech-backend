[build-system]
requires = ["hatchling>=1.21.1"]
build-backend = "hatchling.build"

[project]
name = "adaptive-quiz-backend"
version = "0.1.0"
description = "Adaptive Quiz Backend skeleton (FastAPI + Supabase + Alembic) — no business logic."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Adaptive Team" }]
keywords = ["fastapi", "supabase", "alembic", "sse", "cron", "systemd"]

dependencies = [
  "fastapi==0.111.0",
  "uvicorn[standard]==0.30.1",
  "gunicorn==21.2.0",
  "SQLAlchemy==2.0.30",
  "asyncpg==0.29.0",
  "alembic==1.13.1",
  "pydantic==2.7.1",
  "argon2-cffi==23.1.0",
  "python-jose[cryptography]==3.3.0",
  "httpx==0.27.0",
  "tenacity==8.2.3",
  "orjson==3.10.3",
  "python-slugify==8.0.4",
  "ulid-py==1.3.0",
  "boto3==1.34.69",
]

[project.optional-dependencies]
dev = [
  "ruff==0.3.7",
  "black==24.4.2",
  "mypy==1.10.0",
  "pytest==8.2.0",
  "types-python-jose==3.3.4.20240106",
  "types-orjson==3.6.2",
  "types-requests==2.31.0.20240406",
]

llm = [
  # OpenAI SDK (async) for Module 5
  "openai>=1.30.0,<2",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
fix = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "B", "A", "C4", "SIM", "PL"]
ignore = ["PLR0913","E501"]  # handled by black and many-args for PLR0913; common in FastAPI endpoint funcs


[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
strict_equality = true
plugins = []

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]


# Ignore FastAPI-specific false positives for dependency injection, magic numbers in tests, etc.
per-file-ignores = {"app/auth/middleware.py" = ["B008"], "app/**/router.py" = ["B008"],"tests/**" = ["PLR2004", "PLC0415", "F401"],"rough/**" = ["PLR2004", "PLC0415", "F401", "I001"] }